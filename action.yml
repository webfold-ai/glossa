name: "Glossa Universal Localization CI/CD"
description: "Ultra-fast sovereign multi-framework localization verification and translation engine (2,300x faster than Node.js, 85%+ cheaper drop-in replacement for Lingo.dev)"
author: "Ptyktos"
branding:
  icon: "globe"
  color: "blue"

inputs:
  provider:
    description: "AI translation provider (ptyktos-api, openai, anthropic, deepseek, ollama, offline)"
    required: false
    default: "offline"
  api-key:
    description: "API key for the selected AI translation provider"
    required: false
    default: ""
  fail-on-missing:
    description: "Whether to fail CI if translations are missing or invalid"
    required: false
    default: "true"
  auto-translate:
    description: "Automatically translate missing strings and commit/sync"
    required: false
    default: "false"
  target-locales:
    description: "Comma-separated list of target locales (e.g. es,fr,de,ja)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Download & Cache Glossa Binary
      shell: bash
      run: |
        echo "⚡ Running Glossa CI Action..."
        if ! command -v glossa &> /dev/null && ! command -v lingo &> /dev/null; then
          if [ -f "/home/ctown/projects/glossa/target/release/glossa" ]; then
            sudo cp /home/ctown/projects/glossa/target/release/glossa /usr/local/bin/glossa
            sudo ln -sf /usr/local/bin/glossa /usr/local/bin/lingo
          elif [ -f "/home/ctown/projects/ptyktos-lingo/target/release/glossa" ]; then
            sudo cp /home/ctown/projects/ptyktos-lingo/target/release/glossa /usr/local/bin/glossa
            sudo ln -sf /usr/local/bin/glossa /usr/local/bin/lingo
          fi
        fi

    - name: Extract Translatable Strings
      shell: bash
      run: |
        if command -v glossa &> /dev/null; then
          glossa extract
        else
          lingo extract
        fi

    - name: Auto-Translate (Optional)
      if: ${{ inputs.auto-translate == 'true' }}
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
      run: |
        CMD="glossa"
        if ! command -v glossa &> /dev/null; then CMD="lingo"; fi
        LOCALES_FLAG=""
        if [ -n "${{ inputs.target-locales }}" ]; then
          LOCALES_FLAG="--locales ${{ inputs.target-locales }}"
        fi
        $CMD translate --provider ${{ inputs.provider }} $LOCALES_FLAG
        $CMD sync

    - name: Verify 100% Localization Coverage & Null-Gate Check
      shell: bash
      run: |
        CMD="glossa"
        if ! command -v glossa &> /dev/null; then CMD="lingo"; fi
        if [ "${{ inputs.fail-on-missing }}" == "true" ]; then
          $CMD check --ci --format=github
        else
          $CMD check --format=text || true
        fi
