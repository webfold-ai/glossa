name: "Glossa"
description: "Extract translatable strings, optionally translate missing entries, and fail the job if translations are missing."
author: "webfold-ai"
branding:
  icon: "globe"
  color: "blue"

inputs:
  provider:
    description: "AI translation provider (openai, anthropic, deepseek, ollama, offline)"
    required: false
    default: "offline"
  api-key:
    description: "API key for the selected AI translation provider"
    required: false
    default: ""
  fail-on-missing:
    description: "Whether to fail CI if translations are missing or invalid"
    required: false
    default: "true"
  auto-translate:
    description: "Automatically translate missing strings and commit/sync"
    required: false
    default: "false"
  target-locales:
    description: "Comma-separated list of target locales (e.g. es,fr,de,ja)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install Glossa
      shell: bash
      run: |
        if ! command -v glossa &> /dev/null && ! command -v lingo &> /dev/null; then
          if ! command -v cargo &> /dev/null; then
            echo "::error::glossa is not on PATH and cargo is not available to install it. Install glossa before this step."
            exit 1
          fi
          cargo install --locked --git https://github.com/webfold-ai/glossa glossa
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    - name: Extract Translatable Strings
      shell: bash
      run: |
        if command -v glossa &> /dev/null; then
          glossa extract
        else
          lingo extract
        fi

    - name: Auto-Translate (Optional)
      if: ${{ inputs.auto-translate == 'true' }}
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
      run: |
        CMD="glossa"
        if ! command -v glossa &> /dev/null; then CMD="lingo"; fi
        LOCALES_FLAG=""
        if [ -n "${{ inputs.target-locales }}" ]; then
          LOCALES_FLAG="--locales ${{ inputs.target-locales }}"
        fi
        $CMD translate --provider ${{ inputs.provider }} $LOCALES_FLAG
        $CMD sync

    - name: Check translation coverage
      shell: bash
      run: |
        CMD="glossa"
        if ! command -v glossa &> /dev/null; then CMD="lingo"; fi
        if [ "${{ inputs.fail-on-missing }}" == "true" ]; then
          $CMD check --ci --format=github
        else
          $CMD check --format=text || true
        fi
