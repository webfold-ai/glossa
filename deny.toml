# cargo-deny configuration for glossa.
#
# Run with: cargo deny check
#
# cargo-deny covers licenses, banned sources, banned crates, yanked versions and
# advisories; cargo-audit (see .cargo/audit.toml) checks the RustSec database.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allowed licenses: permissive licenses plus MPL-2.0 (file-level copyleft).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
# No crates are banned.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
