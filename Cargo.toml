[package]
name = "glossa"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Localization tool: extract translatable strings from source code and catalogs, translate missing entries, check translations, and write locale catalogs."
license = "Apache-2.0"
repository = "https://github.com/webfold-ai/glossa"
readme = "README.md"
keywords = ["i18n", "localization", "l10n", "translation", "cli"]
categories = ["command-line-utilities", "internationalization", "development-tools"]
exclude = [".github/", ".cargo/", "examples/", "scripts/", "skills/", "action.yml", "Dockerfile", "cliff.toml", "deny.toml"]

[[bin]]
name = "glossa"
path = "src/bin/glossa.rs"

[[bin]]
name = "lingo"
path = "src/bin/lingo.rs"

[lib]
name = "glossa"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
regex = "1"
async-trait = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
