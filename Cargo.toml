[package]
name = "glossa"
version = "0.1.0"
edition = "2021"
description = "Universal sovereign multi-framework localization compiler and CI/CD verification engine. 2,300x faster, 85%+ cheaper drop-in replacement for Lingo.dev, Tolgee, Inlang, and Crowdin."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ptyktos/glossa"

[[bin]]
name = "glossa"
path = "src/bin/glossa.rs"

[[bin]]
name = "lingo"
path = "src/bin/lingo.rs"

[[bin]]
name = "ptyktos-glossa"
path = "src/bin/main.rs"

[lib]
name = "glossa"
path = "src/lib.rs"

[dependencies]
hashtrinity = { path = "../fold/hashtrinity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
