[package]
name = "glossa"
version = "0.1.0"
edition = "2021"
description = "Localization string extraction and translation-integrity checking for JSX, Vue, Svelte, HTML, Markdown and standard catalog formats. Reads files; no bundler plugin, no client runtime."
license = "FSL-1.1-ALv2"
repository = "https://github.com/Ptyktos/glossa"

[[bin]]
name = "glossa"
path = "src/bin/glossa.rs"

[[bin]]
name = "lingo"
path = "src/bin/lingo.rs"

[[bin]]
name = "ptyktos-glossa"
path = "src/bin/main.rs"

[lib]
name = "glossa"
path = "src/lib.rs"

[dependencies]
hashtrinity = { git = "https://gitlab.tas.twn.network/twn/ptyktos/hashtrinity.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

# Standalone workspace root, declared explicitly.
#
# `glossa` has no workspace of its own, so `~/projects/Cargo.toml` (the aim umbrella) claims it.
# That is harmless in isolation but breaks anything that path-depends `glossa` *and* another
# workspace's crate at the same time: the umbrella then becomes the root that resolves those
# crates' `{ workspace = true }` inheritance, and it does not declare their keys. Symptom, seen
# from three steps away in `ptyktos-api` -> `intent-agent` -> `intent-core`:
#
#   error inheriting `regex` from workspace root manifest's `workspace.dependencies.regex`
#
# That message points at intent-core's manifest and is not a bug in it. Declaring this root
# stops the umbrella from participating in resolution.
[workspace]
