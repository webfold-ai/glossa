[package]
name = "glossa"
version = "0.1.0"
edition = "2021"
description = "Universal sovereign multi-framework localization compiler and CI/CD verification engine. Measured 4.8x-12.6x faster, ~45x lower memory drop-in replacement for Lingo.dev, Tolgee, Inlang, and Crowdin."
license = "FSL-1.1-ALv2"
repository = "https://github.com/Ptyktos/glossa"

[[bin]]
name = "glossa"
path = "src/bin/glossa.rs"

[[bin]]
name = "lingo"
path = "src/bin/lingo.rs"

[[bin]]
name = "ptyktos-glossa"
path = "src/bin/main.rs"

[lib]
name = "glossa"
path = "src/lib.rs"

[dependencies]
hashtrinity = { git = "https://gitlab.tas.twn.network/twn/ptyktos/hashtrinity.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
