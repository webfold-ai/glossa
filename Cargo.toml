[package]
name = "ptyktos-lingo"
version = "0.1.0"
edition = "2021"
description = "Universal multi-framework localization compiler and engine on Apeiron basis. Recreating lingo.dev in Rust and faster, in the spirit of Mitosis."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ptyktos/ptyktos-lingo"

[[bin]]
name = "ptyktos-lingo"
path = "src/bin/main.rs"

[[bin]]
name = "lingo"
path = "src/bin/lingo.rs"

[lib]
name = "ptyktos_lingo"
path = "src/lib.rs"

[dependencies]
hashtrinity = { path = "../fold/hashtrinity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
