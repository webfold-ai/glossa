# cargo-audit configuration.
#
# cargo-audit reads `.cargo/audit.toml`, not a root-level `audit.toml`.
# Anything ignored here must be listed explicitly, with a reason.

[advisories]
informational_warnings = ["unmaintained", "notice"]
ignore = []

[database]
url = "https://github.com/rustsec/advisory-db.git"
fetch = true
stale = false
