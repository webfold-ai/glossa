# GitLab CI configuration for ptyktos-lingo
stages:
  - test
  - i18n

# Cargo.toml pulls hashtrinity via a relative path dependency
# (`../fold/hashtrinity`), assuming a sibling checkout that only exists on a
# dev machine with the full fold workspace cloned. A bare GitLab checkout of
# just this repo has never had that sibling present, so `cargo test`/`cargo
# run` have always failed immediately with "No such file or directory" here
# — before this fix, no push to any branch had ever actually compiled in CI.
#
# Cargo.toml's `../fold/hashtrinity` path matches the old fold-monorepo layout,
# where `fold/hashtrinity/` was the package itself. The standalone extracted
# `Ptyktos/hashtrinity` repo is a workspace whose real package lives one level
# deeper, at `hashtrinity/hashtrinity/` (members = ["hashtrinity", ...]) — so
# clone to a scratch dir and place just the nested package at the exact path
# Cargo.toml expects, rather than changing that path (which real local dev
# against the fold monorepo still relies on).
#
# This runner persists /builds across job runs (confirmed: git checkout logs
# "Reinitialized existing Git repository" rather than cloning fresh each
# time) — only the glossa project's own checkout gets refreshed per job, so
# anything written to a sibling path by an earlier attempt survives. `rm -rf`
# the target first so this step is idempotent regardless of prior state.
#
# The nested package (hashtrinity/hashtrinity/Cargo.toml) uses
# `edition.workspace = true` / `license.workspace = true`, inherited from the
# repo-root workspace manifest's `[workspace.package]` — so it cannot be
# copied out in isolation (Cargo needs to walk up and find that workspace
# root). Keep the full clone intact and symlink the exact path glossa's
# Cargo.toml expects to point *into* it, rather than extracting the
# subdirectory.
.fetch_hashtrinity_dependency: &fetch_hashtrinity_dependency
  - apt-get update -qq && apt-get install -y -qq git ca-certificates
  - rm -rf "${CI_PROJECT_DIR}/../fold/hashtrinity-repo" "${CI_PROJECT_DIR}/../fold/hashtrinity"
  - mkdir -p "${CI_PROJECT_DIR}/../fold"
  - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/twn/ptyktos/hashtrinity.git" "${CI_PROJECT_DIR}/../fold/hashtrinity-repo"
  - ln -s hashtrinity-repo/hashtrinity "${CI_PROJECT_DIR}/../fold/hashtrinity"

test:cargo:
  stage: test
  image: rust:1.80-slim
  before_script:
    - *fetch_hashtrinity_dependency
  script:
    - cargo test --verbose

i18n:check:
  stage: i18n
  image: rust:1.80-slim
  variables:
    FAIL_ON_MISSING: "true"
  before_script:
    - *fetch_hashtrinity_dependency
  script:
    - cargo run --release -- check --ci --format=text
  artifacts:
    when: always
    paths:
      - spbench-results.json
