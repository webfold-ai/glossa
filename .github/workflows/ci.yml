name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: cargo test
        run: cargo test --verbose

      - name: cargo build --release
        run: cargo build --release --bin glossa

      - name: Run glossa bench
        run: |
          cargo run --release --bin glossa -- bench --json-output bench-results.json | tee bench-console.txt

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: |
            bench-results.json
            bench-console.txt
          if-no-files-found: ignore

