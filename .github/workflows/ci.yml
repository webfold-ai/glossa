name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (real, on GitHub's own hosted runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master

      # hashtrinity pulls in via a relative path dependency (../fold/hashtrinity)
      # that assumes a sibling checkout; the extracted repo is itself a
      # workspace whose real package lives one level deeper
      # (hashtrinity/hashtrinity/). GitHub's Ptyktos/hashtrinity and GitLab's
      # twn/ptyktos/hashtrinity have DIVERGED: GitLab's declares an
      # `apeiron = { git = "https://gitlab.tas.twn.network/lucas/apeiron.git" }`
      # dependency that GitHub's copy doesn't have at all (confirmed by
      # reading both Cargo.toml files directly) -- and gitlab.tas.twn.network
      # is an internal/VPN-only host public GitHub runners can't route to at
      # all (TLS handshake fails, not an auth failure). Using GitHub's
      # hashtrinity avoids needing that private network entirely.
      # Ptyktos/hashtrinity is private. The default GITHUB_TOKEN this
      # workflow runs with is scoped only to this repo, not other private
      # repos in the org, so fetching it needs a real cross-repo PAT.
      #
      # This used to be a `git clone` with the PAT interpolated into the
      # clone URL as a basic-auth userinfo segment. That puts the secret
      # in the process argv and in any shell tracing or CI log that echoes
      # the command. actions/checkout takes the token as an input (masked,
      # and never rendered into a URL) instead.
      #
      # `path: ../fold` puts the checkout where the old clone put it — the
      # crate is reached through the relative path dep ../fold/hashtrinity.
      # actions/checkout empties an existing directory before populating
      # it, which is what the previous recursive-delete step was for.
      - name: Fetch hashtrinity dependency (from GitHub, not GitLab)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Ptyktos/hashtrinity
          ref: 87e162bddee174db5d10d788fdf78df8f07cd840 # v0.1.0
          token: ${{ secrets.GH_CROSS_REPO_TOKEN }}
          path: ../fold

      - name: cargo test
        run: cargo test --verbose

      - name: cargo build --release
        run: cargo build --release --bin glossa

      - name: SPBench suite — regenerate fresh, in this same environment
        run: |
          cargo run --release --bin glossa -- bench --spbench --json-output spbench-results.json | tee spbench-console.txt

      - name: Upload spbench results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spbench-results
          path: |
            spbench-results.json
            spbench-console.txt
          if-no-files-found: ignore

      - name: Real-world performance check — precise per-file timing on postiz-app
        run: |
          cp target/release/glossa /usr/local/bin/glossa
          git clone --depth 1 https://github.com/gitroomhq/postiz-app.git /tmp/postiz
          mkdir -p /tmp/timing-results
          cd /tmp/postiz
          find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.cjs' \) -not -path './.git/*' | while read -r f; do
            rm -rf /tmp/bisect-one && mkdir -p /tmp/bisect-one
            cp "$f" "/tmp/bisect-one/$(basename "$f")"
            cd /tmp/bisect-one
            t0=$(date +%s%N)
            set +e
            timeout 20 glossa extract > /dev/null 2>&1
            rc=$?
            set -e
            t1=$(date +%s%N)
            ms=$(( (t1 - t0) / 1000000 ))
            echo "${ms}ms rc=${rc} $f" >> /tmp/timing-results/timings.txt
            cd /tmp/postiz
          done
          sort -rn /tmp/timing-results/timings.txt > "${GITHUB_WORKSPACE}/timing-results.txt"
          echo "=== slowest 30 files (ms, exit code, path) ==="
          head -30 "${GITHUB_WORKSPACE}/timing-results.txt"
          echo "=== summary stats ==="
          awk '{print $1+0}' /tmp/timing-results/timings.txt > /tmp/ms-only.txt
          python3 -c "
          vals = sorted(int(l.strip()) for l in open('/tmp/ms-only.txt') if l.strip())
          n = len(vals)
          print(f'count={n} min={vals[0]}ms max={vals[-1]}ms mean={sum(vals)/n:.1f}ms p50={vals[n//2]}ms p90={vals[int(n*0.9)]}ms p99={vals[int(n*0.99)]}ms')
          "

      - name: Upload timing results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timing-results
          path: timing-results.txt
          if-no-files-found: ignore
