name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (real, on GitHub's own hosted runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # hashtrinity (and its apeiron dependency) are private GitHub repos pinned by rev in
      # Cargo.toml / Cargo.lock; cargo fetches them directly, so no sibling checkout is needed.
      # The default GITHUB_TOKEN is scoped to this repo only, so a credential helper supplies the
      # cross-repo token for github.com. The helper reads GH_CROSS_REPO_TOKEN from the environment
      # each time git calls it, so the secret is never written to git config, a URL or argv, and
      # it is passed only to the steps that run cargo (not to the whole job). GitLab's hashtrinity
      # copy has diverged and is VPN-only; nothing in the graph reaches it any more.
      - name: Let git authenticate to private Ptyktos repos without storing the token
        run: |
          git config --global credential.https://github.com.helper \
            '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GH_CROSS_REPO_TOKEN}"; }; f'
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: cargo test
        run: cargo test --verbose
        env:
          GH_CROSS_REPO_TOKEN: ${{ secrets.GH_CROSS_REPO_TOKEN }}

      - name: cargo build --release
        run: cargo build --release --bin glossa
        env:
          GH_CROSS_REPO_TOKEN: ${{ secrets.GH_CROSS_REPO_TOKEN }}

      - name: SPBench suite — regenerate fresh, in this same environment
        run: |
          cargo run --release --bin glossa -- bench --spbench --json-output spbench-results.json | tee spbench-console.txt

        env:
          GH_CROSS_REPO_TOKEN: ${{ secrets.GH_CROSS_REPO_TOKEN }}
      - name: Upload spbench results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spbench-results
          path: |
            spbench-results.json
            spbench-console.txt
          if-no-files-found: ignore

      - name: Real-world performance check — precise per-file timing on postiz-app
        run: |
          cp target/release/glossa /usr/local/bin/glossa
          git clone --depth 1 https://github.com/gitroomhq/postiz-app.git /tmp/postiz
          mkdir -p /tmp/timing-results
          cd /tmp/postiz
          find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.cjs' \) -not -path './.git/*' | while read -r f; do
            rm -rf /tmp/bisect-one && mkdir -p /tmp/bisect-one
            cp "$f" "/tmp/bisect-one/$(basename "$f")"
            cd /tmp/bisect-one
            t0=$(date +%s%N)
            set +e
            timeout 20 glossa extract > /dev/null 2>&1
            rc=$?
            set -e
            t1=$(date +%s%N)
            ms=$(( (t1 - t0) / 1000000 ))
            echo "${ms}ms rc=${rc} $f" >> /tmp/timing-results/timings.txt
            cd /tmp/postiz
          done
          sort -rn /tmp/timing-results/timings.txt > "${GITHUB_WORKSPACE}/timing-results.txt"
          echo "=== slowest 30 files (ms, exit code, path) ==="
          head -30 "${GITHUB_WORKSPACE}/timing-results.txt"
          echo "=== summary stats ==="
          awk '{print $1+0}' /tmp/timing-results/timings.txt > /tmp/ms-only.txt
          python3 -c "
          vals = sorted(int(l.strip()) for l in open('/tmp/ms-only.txt') if l.strip())
          n = len(vals)
          print(f'count={n} min={vals[0]}ms max={vals[-1]}ms mean={sum(vals)/n:.1f}ms p50={vals[n//2]}ms p90={vals[int(n*0.9)]}ms p99={vals[int(n*0.99)]}ms')
          "

      - name: Upload timing results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-results
          path: timing-results.txt
          if-no-files-found: ignore
