name: gitleaks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, Monday 07:41 UTC — catches secrets that land outside the
    # default-branch/PR window without adding per-commit latency.
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: a value added in one commit and removed in a later
      # one stays reachable in branch history, and a shallow/tree-only
      # scan would pass it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0