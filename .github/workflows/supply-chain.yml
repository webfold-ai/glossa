name: supply-chain

on:
  pull_request:
    paths:
      - '**/*.toml'
      - '**/*.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'native/**'
      - 'src/**'
      - 'upstream/**'
      - 'extensions/**'
  push:
    branches: [main, 'release/**']
  schedule:
    # Run daily at 06:13 UTC. RUSTSEC advisories land throughout the day;
    # a stale green run is the worst outcome (no one sees the CVE).
    - cron: '13 6 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  # Three coordinated gates — all must pass for the workflow to succeed.
  # caretakers (Ptyktos/caretaker) consumes these three signals and the
  # upstream evidence JSON for the supply-chain-control decision; a red
  # signal on any of them blocks release-pr from merging.

  audit:
    name: cargo audit (rustsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # The old taiki-e/install-cargo-audit-action repo is gone (404).
      # taiki-e/install-action is its successor; the `cargo-audit` tag of
      # that repo is the equivalent pin (default `tool` is already
      # cargo-audit, set explicitly here).
      - uses: taiki-e/install-action@2f205a16b33670c6744bb9451ca070d71ad155fa # cargo-audit
        with:
          tool: cargo-audit
      - name: Run cargo audit (BLOCKING on vulnerabilities)
        run: cargo audit --deny warnings

  deny:
    name: cargo deny (licenses, sources, yanked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Run cargo-deny (BLOCKING on policy violations)
        uses: EmbarkStudios/cargo-deny-action@3f4a782664881cf5725d0ffd23969fcce89fd868 # v1.6.3

  sbom:
    name: SBOM + Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install cyclonedx-bom
        run: cargo install --locked cargo-cyclonedx
      # cargo-cyclonedx resolves the dependency graph, which includes private Ptyktos git
      # dependencies (hashtrinity, apeiron). The helper reads the token from the environment of
      # the step that runs cargo; nothing is written to git config, a URL or argv.
      - name: Let git authenticate to private Ptyktos repos without storing the token
        run: |
          git config --global credential.https://github.com.helper \
            '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GH_CROSS_REPO_TOKEN}"; }; f'
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --override-filename glossa.sbom.json
        env:
          GH_CROSS_REPO_TOKEN: ${{ secrets.GH_CROSS_REPO_TOKEN }}
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glossa-sbom
          path: glossa.sbom.json
          retention-days: 90

  # caretakers-specific bridge — the cross-repo compliance signal that
  # Ptyktos/caretaker consumes. caretakers records the SBOM + the audit
  # + the deny result into the supply-chain evidence stream; the release
  # gate reads them at merge-time.
  evidence:
    name: Emit supply-chain evidence (for caretakers)
    runs-on: ubuntu-latest
    if: always()
    needs: [audit, deny, sbom]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Build evidence payload
        run: |
          mkdir -p evidence
          {
            echo "{"
            echo "  \"event\": \"ptyktos.supply_chain.audit\","
            echo "  \"ts\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"repo\": \"Ptyktos/glossa\","
            echo "  \"audit\": \"${{ needs.audit.result }}\","
            echo "  \"deny\": \"${{ needs.deny.result }}\","
            echo "  \"sbom_path\": \"glossa.sbom.json\""
            echo "}"
          } > evidence/supply-chain.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-evidence
          path: evidence/supply-chain.json
