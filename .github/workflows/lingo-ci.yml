name: "i18n Localization CI"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  localization-check:
    name: "Check Translation Coverage & Placeholders"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The action this workflow wants IS this repository's own root-level
      # `action.yml` (a composite action: extract -> translate -> check, with
      # exactly the provider / api-key / fail-on-missing inputs used below).
      # The old `Ptyktos/ptyktos-lingo@v1` could never be pinned: the repo path
      # redirects (GitHub transfer/rename) to Ptyktos/glossa, which has NO
      # tags at all (`gh api repos/Ptyktos/ptyktos-lingo/tags` -> []), so
      # there is no 40-char SHA behind `@v1` to pin and no version comment
      # that would survive audit. Referencing the local action (`./`) keeps
      # the workflow on the code in this same commit, needs no SHA pin by
      # construction, and cannot drift from the checked-out source.
      - name: Run ptyktos-lingo CI (this repo's own composite action)
        uses: ./
        with:
          fail-on-missing: "true"
          provider: "openai"
          api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Auto-Commit & Push if Updated (PR branch)
        if: github.event_name == 'pull_request' && env.TRANSLATIONS_UPDATED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lingo.lock locales/
          git commit -m "chore(i18n): automated translation update via ptyktos-lingo [skip ci]" || exit 0
          git push
