name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARETAKERS_BUMP_PACKAGE: glossa

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - name: Install caretakers-bump
        # The org repo is Ptyktos/caretaker (singular). The old
        # Ptyktos/caretakers path 404s, so this install always failed.
        # `cargo install <git-url> <PKG>` takes the PACKAGE name, not the
        # binary name: in Ptyktos/caretaker the package is `caretaker-bump`
        # and its [[bin]] is `caretakers-bump` (confirmed via
        # `gh api repos/Ptyktos/caretaker/contents/caretaker-bump/Cargo.toml`).
        # Passing the binary name made cargo fail with "package ID specification
        # `caretakers-bump` did not match any packages"; the later steps below
        # still invoke the installed BINARY, `caretakers-bump`, which is correct.
        run: cargo install --locked --git https://github.com/Ptyktos/caretaker caretaker-bump
      - name: Run caretakers-bump plan
        run: caretakers-bump plan --json --range HEAD > /tmp/plan.json
      - name: Show plan
        if: always()
        # Block scalar, not a plain one: a plain YAML scalar may not contain
        # ": ", so the jq filter's `{current: .current, ...}` made this file
        # fail to parse (the workflow never got as far as creating a job).
        run: >-
          jq '{current: .current, next: .next, bump: .bump, commits: .commits}'
          /tmp/plan.json
      - name: Apply bump
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "caretakers-bump"
          git config user.email "bump@ptyktos.com"
          caretakers-bump apply --auto-push
