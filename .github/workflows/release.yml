name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARETAKERS_BUMP_PACKAGE: glossa

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - name: Install caretakers-bump
        # The org repo is Ptyktos/caretaker (singular) and it is private, so cargo needs a
        # token that can read it: the default GITHUB_TOKEN is scoped to this repo only (the
        # run of 2026-11-05 died here with "failed to authenticate when downloading
        # repository"). The credential helper reads GH_CROSS_REPO_TOKEN from the environment
        # each time git calls it, so the secret is never written to git config, a URL or argv.
        run: |
          git config --global credential.https://github.com.helper \
            '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GH_CROSS_REPO_TOKEN}"; }; f'
          cargo install --locked --git https://github.com/Ptyktos/caretaker caretakers-bump
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GH_CROSS_REPO_TOKEN: ${{ secrets.GH_CROSS_REPO_TOKEN }}
      - name: Run caretakers-bump plan
        run: caretakers-bump plan --json --range HEAD > /tmp/plan.json
      - name: Show plan
        if: always()
        # Block scalar, not a plain one: a plain YAML scalar may not contain
        # ": ", so the jq filter's `{current: .current, ...}` made this file
        # fail to parse (the workflow never got as far as creating a job).
        run: >-
          jq '{current: .current, next: .next, bump: .bump, commits: .commits}'
          /tmp/plan.json
      - name: Apply bump
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "caretakers-bump"
          git config user.email "bump@ptyktos.com"
          caretakers-bump apply --auto-push
